version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riskshield
      POSTGRES_PASSWORD: riskshield
      POSTGRES_DB: riskshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskshield"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - riskshield

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - riskshield

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://riskshield:riskshield@postgres:5432/riskshield?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-riskshield-dev-secret-change-in-production-min-32-chars-long}
      PORT: "8080"
      DEMO_MODE: "true"
      MIGRATIONS_DIR: /app/migrations
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - riskshield
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      PORT: "8001"
    ports:
      - "8001:8001"
    networks:
      - riskshield
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - riskshield

volumes:
  postgres_data:

networks:
  riskshield:
    driver: bridge
